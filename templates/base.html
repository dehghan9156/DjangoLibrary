<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LIBRARY{% endblock %}</title>
    {% include 'bootstrapt.html' %}
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            flex: 1;
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .footer {
            text-align: center;
            padding: 10px;
            background-color: #2e7d32;
            color: white;
            width: 100%;
            position: relative;
        }
    </style>
</head>
<body>
<!-- 🔹 ناوبار اصلاح‌شده -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #2e7d32;">
    <div class="container-fluid">
        <a class="navbar-brand text-white" href="#">📚 LIBRARY</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto"> <!-- تغییر ms-auto به me-auto -->
                <li class="nav-item"><a class="nav-link text-white" href="#">🏠Home</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">📖Books</a></li>
                {% if request.user.is_authenticated %}
                    <li class="nav-item"><a class="nav-link text-white" href="#">📖Logout</a></li>
                {% else %}
                    <li class="nav-item"><a class="nav-link text-white" href="{% url 'accounts:register-user' %}">🔑Login</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="{% url 'accounts:login-user' %}">👤Register</a></li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>


<!-- 🔹 محتوای صفحه -->
{% include 'messages.html' %}
<div class="container">
    {% block content %}{% endblock %}
</div>

<!-- 🔹 فوتر -->
<footer class="footer">
    <p>تمام حقوق محفوظ است &copy; 2025</p>
</footer>
</body>
</html>
