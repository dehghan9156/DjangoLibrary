{% extends 'base.html' %}
{% block content %}
    <div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="card p-4 shadow-lg" style="width: 400px; border-radius: 15px;">
            <h4 class="text-center mb-3">Profile</h4>
            <div class="text-center mb-4">
                <img src="{{profile.image}}"
                     style="border-radius: 50%; height: 220px; width: 220px; object-fit: cover;">
            </div>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-success w-100" style="margin-bottom: 5px;">Edit</button>
            </form>
        </div>
    </div>
{% endblock %}
